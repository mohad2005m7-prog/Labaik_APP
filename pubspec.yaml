name: labaik
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  shared_preferences: ^2.3.2
  google_maps_flutter: ^2.18.2
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  # الاتصال بالمشرف (tel:) وفتح موقع على الخريطة
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  mobile_scanner: ^7.4.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/field_mode/
    - assets/images/supervisor/
    - assets/images/trip/
    - assets/images/help/
    - assets/images/group/
    - assets/images/learning/
    - assets/images/tawaf/
    - assets/images/saee/
    - assets/images/notifications/
    - assets/images/company/
    # خط Tajawal (شاشات إعداد الرحلة) — google_fonts بياخده من هون بدل ما ينزّله من الإنترنت
    - assets/google_fonts/
    # ألوان الخريطة (Google Maps style)
    - assets/styles/map_style.json

  # Noto Sans Arabic المتغيّرة (الخط اللي Figma بيرسم فيه العربي) — بتقبل أي وزن رقمي
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    # Poppins: Figma بيرسم فيه الأرقام والرموز اللاتينية بنصوص Poppins (Regular 400 و Medium 500)
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Main Logo.jpeg"
  adaptive_icon_background: "#1c3b32"
  adaptive_icon_foreground: "assets/images/Main Logo.jpeg"

flutter_native_splash:
  color: "#1c3b32"
  android_12:
    color: "#1c3b32"
    icon_background_color: "#1c3b32"
    image: "assets/images/splash_transparent.png"
